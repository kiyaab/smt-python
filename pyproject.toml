[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signtranslator"
version = "0.1.0"
description = "Real-Time Hand Motion-to-Sentence & Multilingual Translator for Inclusive Communication"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "STEM Center Innovation Team"}
]
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.9",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "onnxruntime>=1.16.0",
    "psutil>=5.9.0",
    "PyQt6>=6.5.0",
    "PyYAML>=6.0.1",
    "deep-translator>=1.11.4",
    "gTTS>=2.4.0",
    "pyttsx3>=2.90"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
